services:
  whasappc:
    build: .
    container_name: yardimet.site
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file:
      - ./whatsapp-engine/.env
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      SESSION_STORE: "${SESSION_STORE:-sqlite}"
      TRUST_PROXY: "${TRUST_PROXY:-1}"
      WHASAPPC_DATA_DIR: /data
      TZ: Europe/Istanbul
    volumes:
      - whasappc-data:/data
      - whasappc-uploads:/app/whatsapp-engine/uploads
      - whasappc-auth:/app/whatsapp-engine/auth
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/healthz').then(res => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  whasappc-data:
  whasappc-uploads:
  whasappc-auth:
